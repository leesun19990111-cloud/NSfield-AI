<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>회원가입 — NS Field</title><link rel="stylesheet" href="style.css"></head><body>

<div class="container-narrow">
  <div class="card card-pad-lg stack" style="gap:18px">
    <div style="text-align:center">
      <a class="brand" href="01-home.html" style="font-size:18px">NS Field<span class="dot">.</span></a>
    </div>
    <h2 class="h2" style="text-align:center">회원가입</h2>

    <div class="field" style="margin-bottom:0">
      <label class="label" for="email">이메일</label>
      <input class="input" id="email" type="email" placeholder="you@example.com">
    </div>
    <div class="field" style="margin-bottom:0">
      <label class="label" for="pw">비밀번호</label>
      <input class="input" id="pw" type="password" placeholder="8자 이상">
    </div>
    <div class="field" style="margin-bottom:0">
      <label class="label" for="nick">표시 이름 (닉네임)</label>
      <input class="input" id="nick" type="text" placeholder="민수">
    </div>

    <a class="btn btn-primary btn-block" href="10-wallet.html">가입하기</a>

    <div class="alert alert-info">가입 후 원화로 입금하고 요청하면, 관리자가 현재 환율로 환산해 달러로 충전해 드립니다.</div>

    <p class="dim small" style="text-align:center">이미 계정이 있으신가요? <a href="02-login.html" style="color:var(--accent)">로그인</a></p>
  </div>
</div>

</body></html>
