<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로그인 — NS Field</title><link rel="stylesheet" href="style.css"></head><body>

<div class="container-narrow">
  <div class="card card-pad-lg stack" style="gap:18px">
    <div style="text-align:center">
      <a class="brand" href="01-home.html" style="font-size:18px">NS Field<span class="dot">.</span></a>
    </div>
    <h2 class="h2" style="text-align:center">로그인</h2>

    <div class="field" style="margin-bottom:0">
      <label class="label" for="email">이메일</label>
      <input class="input" id="email" type="email" placeholder="you@example.com">
    </div>
    <div class="field" style="margin-bottom:0">
      <label class="label" for="pw">비밀번호</label>
      <input class="input" id="pw" type="password" placeholder="••••••••">
    </div>

    <a class="btn btn-primary btn-block" href="10-wallet.html">로그인</a>

    <div class="row" style="gap:12px">
      <div style="flex:1; height:1px; background:var(--border)"></div>
      <span class="dim small">또는</span>
      <div style="flex:1; height:1px; background:var(--border)"></div>
    </div>

    <a class="btn btn-ghost btn-block" href="10-wallet.html">Google로 계속하기</a>

    <p class="dim small" style="text-align:center">계정이 없으신가요? <a href="03-signup.html" style="color:var(--accent)">회원가입</a></p>
  </div>
</div>

</body></html>
